<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contabilidad</title>

    <link rel="stylesheet" href="/css/contabilidad.css">

</head>

<body>

<div class="form-container">

    <h2>Contabilidad</h2>

    <form action="#" method="POST">

        <div class="form-group">
            <label>Ventas</label>
            <input type="text" id="ventas" required>
        </div>

        <div class="form-group">
            <label>Fecha</label>
            <input type="date" id="fecha" required>
        </div>

        <div class="form-group">
            <label>Ingresos</label>
            <input type="text" id="ingresos" required>
        </div>

        <div class="form-group">
            <label>Egresos</label>
            <input type="text" id="egresos" required>
        </div>

        <div class="form-group">
            <label>Concepto</label>
            <input type="text" id="concepto" required>
        </div>

        <div class="form-group">
            <label>Valor</label>
            <input type="text" id="valor" required>
        </div>

        <button
            type="button"
            onclick="ValidarDatos()"
            class="btn-submit">

            Registrar

        </button>

    </form>

    <br>

    <a href="/index.html">

        <button
            type="button"
            class="btn-submit">

            Inicio

        </button>

    </a>

</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script src="/js/contabilidad.js"></script>

</body>
</html>
